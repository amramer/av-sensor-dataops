# Data pipeline on real nuScenes data, run by GitHub Actions (weekly or on demand).
# Pulls the tracked raw data from the DVC remote, runs the data stages,
# pushes the new dataset version and opens a pull request with the updated
# dvc.lock + reports, so every dataset release is reviewed like code.
#
# Repository secrets needed:
#   DVC_ACCESS_KEY_ID, DVC_SECRET_ACCESS_KEY   DVC remote (e.g. Cloudflare R2)
#   AVDATA_KPI_DB_URL                          optional, Postgres for Grafana
name: data-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DVC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_SECRET_ACCESS_KEY }}
      AVDATA_KPI_DB_URL: ${{ secrets.AVDATA_KPI_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Skip when no DVC remote credentials are configured
        id: guard
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "DVC remote secrets not set - nothing to do" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        if: steps.guard.outputs.run == 'true'
        with: { distribution: temurin, java-version: "17" }
      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.run == 'true'
      - if: steps.guard.outputs.run == 'true'
        run: uv pip install --system -e ".[spark,dvc,postgres]"
      - name: Pull raw data + previous outputs
        if: steps.guard.outputs.run == 'true'
        run: dvc pull --allow-missing
      - name: Run data stages
        if: steps.guard.outputs.run == 'true'
        run: dvc repro kpis export_yolo
      - name: Publish KPIs
        if: steps.guard.outputs.run == 'true' && env.AVDATA_KPI_DB_URL != ''
        run: avdata publish-kpis
      - name: Push dataset version
        if: steps.guard.outputs.run == 'true'
        run: dvc push
      - name: Summary
        if: steps.guard.outputs.run == 'true'
        run: dvc metrics diff HEAD --md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: peter-evans/create-pull-request@v7
        if: steps.guard.outputs.run == 'true'
        with:
          branch: data-release/${{ github.run_id }}
          title: "Data release ${{ github.run_id }}"
          commit-message: "data release ${{ github.run_id }}"
          body: "Automated data pipeline run. Review `dvc.lock`, reports/kpis.json and reports/quality/summary.json."
          add-paths: |
            dvc.lock
            reports/*.json
            reports/quality/summary.json
            reports/coverage.html
