# Local Kubernetes cluster:  kind create cluster --name avdata --config deploy/k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # API NodePort -> http://localhost:30080
        hostPort: 30080
