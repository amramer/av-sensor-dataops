[project]
name = "avdata"
version = "0.1.0"
description = "Automated pipeline that turns raw vehicle sensor logs (nuScenes) into versioned, quality-checked, ML-ready datasets, and trains, evaluates and serves a camera detector on them."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Amr Amer" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2,<3",          # PySpark 4 does not fully support pandas 3 yet
    "pyarrow>=15",
    "pandera>=0.20",
    "pyyaml>=6",
    "pydantic>=2.6",
    "pillow>=10",
    "plotly>=5.20",
    "sqlalchemy>=1.4",
    "typer>=0.12",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
train = ["ultralytics>=8.3", "mlflow>=2.14", "onnx>=1.16"]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.18",
    "prometheus-client>=0.20",
]
postgres = ["psycopg[binary]>=3.1"]
dvc = ["dvc[s3]>=3.50"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "onnx>=1.16",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
avdata = "avdata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avdata"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
    "N803", "N806", "RUF001", "RUF002", "RUF003",
    "B008",  # FastAPI declares params via File()/Query() defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "spark: needs a Java runtime for PySpark",
    "train: needs ultralytics/torch",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
